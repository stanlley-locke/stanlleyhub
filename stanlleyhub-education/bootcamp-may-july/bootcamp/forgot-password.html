<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | Secure Recovery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/forgot-password.css">
</head>
<body>
<div class="auth-card" id="forgotContainer">
  <h1>Reset password</h1>
  <div class="subtitle">We'll help you create a new one</div>

  <!-- Step 1: Email verification -->
  <div id="step1-email">
    <div class="input-group">
      <label>Registered email</label>
      <i class="fas fa-envelope"></i>
      <input type="email" id="resetEmail" placeholder="you@company.com" autocomplete="email">
    </div>
    <button id="verifyEmailBtn" class="btn-primary"><i class="fas fa-paper-plane"></i> Verify email</button>
  </div>

  <!-- Step 2: New password (hidden initially) -->
  <div id="step2-reset" style="display: none;">
    <form id="resetPasswordForm">
      <div class="input-group">
        <label>New password</label>
        <div class="password-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>
          <span class="toggle-pw" onclick="togglePassword('newPassword')"><i class="far fa-eye-slash"></i></span>
        </div>
      </div>
      <div class="input-group">
        <label>Confirm new password</label>
        <div class="password-wrapper">
          <i class="fas fa-check"></i>
          <input type="password" id="confirmNewPassword" placeholder="Repeat password" required>
          <span class="toggle-pw" onclick="togglePassword('confirmNewPassword')"><i class="far fa-eye-slash"></i></span>
        </div>
      </div>
      <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Update password</button>
    </form>
  </div>

  <div id="forgotMessage" class="message-banner"></div>
  <div class="form-footer">
    <a href="login.html"> Back to login</a>
  </div>
</div>
<script src="/js/forgot-password.js"></script>
</body>
</html>
