<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | Join Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/signup.css">
</head>
<body>
<div class="auth-card">
  <h1>Create account</h1>
  <div class="subtitle">Start your journey with us</div>
  <form id="signupForm">
    <div class="input-group">
      <label>Full name</label>
      <i class="fas fa-user"></i>
      <input type="text" id="signupName" placeholder="Alex Morgan" autocomplete="name" required>
    </div>
    <div class="input-group">
      <label>Email address</label>
      <i class="fas fa-envelope"></i>
      <input type="email" id="signupEmail" placeholder="alex@example.com" autocomplete="email" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <div class="password-wrapper">
        <i class="fas fa-key"></i>
        <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
        <span class="toggle-pw" onclick="togglePassword('signupPassword')"><i class="far fa-eye-slash"></i></span>
      </div>
    </div>
    <div class="input-group">
      <label>Confirm password</label>
      <div class="password-wrapper">
        <i class="fas fa-check-circle"></i>
        <input type="password" id="signupConfirm" placeholder="Repeat password" required>
        <span class="toggle-pw" onclick="togglePassword('signupConfirm')"><i class="far fa-eye-slash"></i></span>
      </div>
    </div>
    <button type="submit" class="btn-primary"><i class="fas fa-user-plus"></i> Sign up</button>
  </form>
  <div id="signupMessage" class="message-banner"></div>
  <div class="form-footer">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>
<script src="/js/signup.js"></script>
</body>
</html>
